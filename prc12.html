<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f9;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            flex: 1 1 300px; 
            box-sizing: border-box;
            text-align: center;
        }

        .card img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

       
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="image(1)1.png" alt="Project 1">
            <h3>Web Design Project</h3>
            <p>A modern and clean web design for a local business.</p>
        </div>
        <div class="card">
            <img src="image(2)2.png" alt="Project 2">
            <h3>Branding Campaign</h3>
            <p>Complete branding from logo design to social media assets.</p>
        </div>
        <div class="card">
            <img src="image(3)3.png" alt="Project 3">
            <h3>Mobile App UI</h3>
            <p>User interface design for a new productivity application.</p>
        </div>
    </div>
</body>
</html>
